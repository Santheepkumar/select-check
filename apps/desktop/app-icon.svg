<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="checkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312e81" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg)" filter="url(#shadow)" />

  <!-- Inner subtle border -->
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2" />

  <!-- Floating Sparkle / Selection Badge -->
  <circle cx="160" cy="170" r="18" fill="#38bdf8" opacity="0.85" />
  <circle cx="355" cy="150" r="12" fill="#a78bfa" opacity="0.75" />

  <!-- Checkmark / Selection Indicator -->
  <path
    d="M165 265 L225 325 L350 195"
    fill="none"
    stroke="url(#checkGlow)"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Subtle cursor underline dot -->
  <line x1="170" y1="385" x2="342" y2="385" stroke="#e0e7ff" stroke-width="18" stroke-linecap="round" opacity="0.6" />
</svg>
