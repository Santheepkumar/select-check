name = "select-check-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
OPENAI_MODEL = "gpt-4o-mini"
FREE_DAILY_LIMIT = "10"
AUTH_DAILY_LIMIT = "100"

[[kv_namespaces]]
binding = "QUOTA_KV"
id = "b41b26b9843b4df99a798cb6f73805e8"

# [[d1_databases]]
# binding = "DB"
# database_name = "select-check-db"
# database_id = "replace-with-cloudflare-d1-id"

# Secrets to configure via `wrangler secret put`:
# - OPENAI_API_KEY
# - JWT_SECRET
# - SUPABASE_URL (optional if using Supabase Auth)
# - SUPABASE_ANON_KEY (optional if using Supabase Auth)
